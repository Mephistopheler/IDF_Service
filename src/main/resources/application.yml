spring:
  application.name: expense-limit-service
  threads.virtual.enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${DATABASE_USER:expenses}
    password: ${DATABASE_PASSWORD:expenses}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server.error.include-message: never
rates:
  base-url: ${RATES_BASE_URL:https://api.frankfurter.app}
  connect-timeout: 2s
  read-timeout: 3s
  month-zone: ${MONTH_ZONE:Asia/Almaty}
